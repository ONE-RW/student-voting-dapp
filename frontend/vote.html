<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Voting Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header>
<h1>Student Voting Portal</h1>
<p>Connect the wallet address registered by the voting administrator.</p>
<button id="connectWalletButton">Connect Wallet</button>
<p id="walletStatus">Wallet not connected</p>
<p id="networkStatus">Network not checked</p>
<p><a href="index.html">Administrator portal</a></p>
</header>
<main>
<section>
<h2>Available Candidates</h2>
<div id="candidateList"></div>
</section>
<section class="results-section">
<h2>Voting Results</h2>
<div id="results"></div>
</section>
</main>
<p id="message"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<script src="vote.js"></script>
</body>
</html>
